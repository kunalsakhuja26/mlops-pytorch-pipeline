apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serving-hpa
  namespace: ml-training
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scales up when the pods hit 80% of their requested CPU (500m)
          averageUtilization: 80